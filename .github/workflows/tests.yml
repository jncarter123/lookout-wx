name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis, pdo_sqlite, simplexml
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          BROADCAST_CONNECTION: log

      - name: Run tests
        run: php vendor/bin/pest
        env:
          BROADCAST_CONNECTION: log

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --omit=dev

  # Builds the image and brings the whole compose stack up (MySQL and Redis
  # included), so a change that breaks the image, the migrations on MySQL, or
  # the container wiring fails the PR, not the release.
  docker:
    runs-on: ubuntu-latest

    name: Docker image

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lookout-wx:latest
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: |
          cp docker.env.example docker.env
          docker compose up -d --no-build --wait --wait-timeout 240

      - name: Check health end to end
        run: |
          curl -fsS http://127.0.0.1:8000/up > /dev/null
          curl -fsS http://127.0.0.1:8000/login | grep -q 'name="pusher-key"'
          docker compose exec -T app php artisan migrate:status | grep -q removed_from_feed_at
          docker compose exec -T horizon php artisan horizon:status
          docker compose exec -T app php artisan db:seed --force

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
